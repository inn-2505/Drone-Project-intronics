{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drone F722 Control Mode</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}" />
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* สไตล์เพิ่มเติมสำหรับหน้าจอบังคับโดยเฉพาะ */
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media (max-width: 1024px) {
            .grid-layout { grid-template-columns: 1fr; }
        }
        .hud-card {
            background: #0f172a;
            border: 1px solid #1f4068;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .joystick-space {
            width: 160px;
            height: 160px;
            background: #1e293b;
            border: 4px solid #1f4068;
            border-radius: 50%;
            margin: 0 auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .joystick-stick {
            width: 50px;
            height: 50px;
            background: #00f2fe;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
        }
        .btn-action {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            text-transform: uppercase;
        }
        .btn-takeoff { background: #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.3); }
        .btn-land { background: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }
        .btn-emergency { background: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); font-size: 1.1rem; }
    </style>
</head>
<body>

<div style="background-color: #111d27; border-bottom: 2px solid #1f4068; padding: 12px 20px; margin-bottom: 30px;">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
        
        <span style="color: #fff; font-weight: bold; font-size: 1.2rem; letter-spacing: 1px;">🛸 DRONE F722 SYSTEM</span>
        
        <div style="display: flex; gap: 15px; align-items: center;"> <a href="{% url 'dashboard' %}" style="color: #aaa; text-decoration: none; font-weight: bold; padding: 6px 12px; transition: 0.3s;" onmouseover="this.style.color='#00f2fe'" onmouseout="this.style.color='#aaa'">
                📊 Dashboard
            </a>
            <a href="{% url 'control_page' %}" style="color: #00f2fe; text-decoration: none; font-weight: bold; padding: 6px 12px; border-bottom: 2px solid #00f2fe;">
                🕹️ Control Mode
            </a>
            
            <button id="btn-mode-toggle" onclick="handleModeSwitch()" style="background-color: #ef4444; color: white; padding: 6px 14px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.9rem; transition: 0.3s; box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);">
                🔴 Current Mode: AUTO (GPS)
            </button>
        </div>
        
    </div>
</div>
<div style="max-width: 1400px; margin: 0 auto; padding: 0 20px;">
    
    <div class="grid-layout">
        
        <div>
            <div class="hud-card">
                <h3 style="color: #00f2fe; margin-top: 0;"><i class="fa-solid fa-plane-departure"></i> Commands</h3>
                <button class="btn-action btn-takeoff" onclick="sendActionCommand('TAKEOFF')"><i class="fa-solid fa-arrow-up"></i> Auto Takeoff</button>
                <button class="btn-action btn-land" onclick="sendActionCommand('LAND')"><i class="fa-solid fa-arrow-down"></i> Auto Land</button>
                <button class="btn-action btn-land" onclick="sendActionCommand('RTH')"style="background: #3b82f6;" onclick="sendActionCommand('RTL')"><i class="fa-solid fa-house"></i> Return To Home</button>
            </div>
            
            <div class="hud-card" style="border-color: #ef4444;">
                <h3 style="color: #ef4444; margin-top: 0;"><i class="fa-solid fa-triangle-exclamation"></i> Critical Safety</h3>
                <button class="btn-action btn-emergency" onclick="sendActionCommand('EMERGENCY')"><i class="fa-solid fa-skull"></i> Emergency Cut</button>
            </div>
        </div>
        
        <div class="hud-card" style="display: flex; flex-direction: column; justify-content: space-between;">
    <h3 style="color: #00f2fe; margin-top: 0; text-align: center;"><i class="fa-solid fa-gamepad"></i> Tactical Flight Controller</h3>
    
    <style>
        .dpad-container {
            display: grid;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(3, 55px);
            gap: 8px;
            justify-content: center;
            background: #0b111e;
            padding: 15px;
            border-radius: 50%; /* ทำกรอบวงกลมล้อมรอบชุดปุ่ม */
            border: 2px solid #1f4068;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
        }
        .btn-arrow {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        /* เอฟเฟกต์เมื่อเอาเมาส์ไปชี้ปุ่ม (Hover) จะเรืองแสงนีออนสีฟ้า */
        .btn-arrow:hover {
            background: #00f2fe;
            color: #0f172a;
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
            transform: scale(1.05);
        }
        /* เอฟเฟกต์เมื่อกดปุ่ม (Active) */
        .btn-arrow:active {
            transform: scale(0.95);
        }
        .center-label {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>

    <div style="display: flex; justify-content: space-around; margin: 30px 0; gap: 20px; flex-wrap: wrap;">
        
        <div style="text-align: center;">
            <p style="color: #aaa; font-size: 0.85rem; margin-bottom: 15px; font-weight: 500;">ALTITUDE / YAW</p>
            <div class="dpad-container">
                <div></div>
                <button class="btn-arrow" id="btn-th-up" onclick="sendDirectionCommand('THROTTLE_UP')"><i class="fa-solid fa-chevron-up"></i></button>
                <div></div>
                
                <button class="btn-arrow" id="btn-yaw-left" onclick="sendDirectionCommand('YAW_LEFT')"><i class="fa-solid fa-rotate-left"></i></button>
                <div class="center-label">Alt</div>
                <button class="btn-arrow" id="btn-yaw-right" onclick="sendDirectionCommand('YAW_RIGHT')"><i class="fa-solid fa-rotate-right"></i></button>
                
                <div></div>
                <button class="btn-arrow" id="btn-th-down" onclick="sendDirectionCommand('THROTTLE_DOWN')"><i class="fa-solid fa-chevron-down"></i></button>
                <div></div>
            </div>
        </div>
        
        <div style="text-align: center;">
            <p style="color: #aaa; font-size: 0.85rem; margin-bottom: 15px; font-weight: 500;">PITCH / ROLL</p>
            <div class="dpad-container">
                <div></div>
                <button class="btn-arrow" id="btn-pitch-fwd" onclick="sendDirectionCommand('PITCH_FORWARD')"><i class="fa-solid fa-caret-up"></i></button>
                <div></div>
                
                <button class="btn-arrow" id="btn-roll-lft" onclick="sendDirectionCommand('ROLL_LEFT')"><i class="fa-solid fa-caret-left"></i></button>
                <div class="center-label">Dir</div>
                <button class="btn-arrow" id="btn-roll-rgt" onclick="sendDirectionCommand('ROLL_RIGHT')"><i class="fa-solid fa-caret-right"></i></button>
                
                <div></div>
                <button class="btn-arrow" id="btn-pitch-bak" onclick="sendDirectionCommand('PITCH_BACKWARD')"><i class="fa-solid fa-caret-down"></i></button>
                <div></div>
            </div>
        </div>

    </div>
    
    <div style="background: #020617; padding: 10px; border-radius: 6px; border: 1px solid #1e293b; text-align: center;">
        <span style="color: #64748b; font-size: 0.85rem;">Last Transmission:</span> 
        <strong id="actionLog" style="color: #00f2fe; font-family: monospace; font-size: 1rem; margin-left: 5px; text-shadow: 0 0 10px rgba(0,242,254,0.4)">NONE</strong>
    </div>
</div>
        
        <div>
            <div class="hud-card">
                <h3 style="color: #00f2fe; margin-top: 0;"><i class="fa-solid fa-sliders"></i> Cruise Limits</h3>
                
                <div style="margin-bottom: 20px;">
                    <label style="color: #aaa; display: block; margin-bottom: 5px; font-size: 0.9rem;">Max Altitude Offset: <span id="altVal" style="color:#00f2fe">30m</span></label>
                    <input type="range" min="5" max="120" value="30" style="width:100%; cursor: pointer;" oninput="document.getElementById('altVal').innerText = this.value + 'm'">
                </div>
                
                <div>
                    <label style="color: #aaa; display: block; margin-bottom: 5px; font-size: 0.9rem;">Max Cruise Speed: <span id="speedVal" style="color:#00f2fe">5 m/s</span></label>
                    <input type="range" min="1" max="15" value="5" style="width:100%; cursor: pointer;" oninput="document.getElementById('speedVal').innerText = this.value + ' m/s'">
                </div>
            </div>
            
            <div class="hud-card">
                <h3 style="color: #00f2fe; margin-top: 0;"><i class="fa-solid fa-circle-info"></i> Control Logs</h3>
                <div id="control-logs-container" style="background: #020617; border-radius: 4px; padding: 10px; height: 110px; font-family: monospace; font-size: 0.8rem; color: #10b981; overflow-y: auto;">
                    [System] Ground Control Station Ready...<br>
                </div>
            </div>
        </div>
        
    </div>
</div>


<script src="{% static 'js/mode-sync.js' %}" defer></script>
<script src="{% static 'js/control.js' %}" defer></script>
</body>
</html>
